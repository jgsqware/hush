name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test)" || { gofmt -l cmd internal test; exit 1; }
      - run: go vet ./... && go vet -tags integration ./test/...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ansible: "2.16", python: "3.12" }
          - { ansible: "2.20", python: "3.13" }
          - { ansible: "2.21", python: "3.13" }
    name: integration (ansible-core ${{ matrix.ansible }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "ansible-core==${{ matrix.ansible }}.*"
      - run: ansible-playbook --version
      - run: go test -tags integration -count=1 -v ./test/integration/
